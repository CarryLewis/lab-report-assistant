<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原文件阅读器</title><link rel="stylesheet" href="/vendor/pdfjs/pdf_viewer.css"><style>
*{box-sizing:border-box}body{margin:0;font:12px system-ui;color:#e9edf2;background:#525659}#tools{height:104px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#30343b;flex-wrap:wrap}button,select,input{font:inherit;padding:4px;border-radius:3px;border:1px solid #747a83;background:#fff;color:#243746}input{width:46px}button:disabled{opacity:.5}#viewerContainer{position:absolute;inset:104px 0 0;overflow:auto}#error{padding:16px;color:#fff}#tools label{display:flex;align-items:center;gap:5px}a{color:#d5e8ff}#readerState{margin-left:auto}@media(max-width:440px){#tools{height:136px}#viewerContainer{top:136px}}
.visual-select-layer{position:absolute;inset:0;z-index:60;cursor:crosshair;background:#245f8f0c;touch-action:none}.visual-selection-box,.visual-region-highlight{position:absolute;border:2px solid #358dd0;background:#358dd026;pointer-events:none}.visual-region-highlight{z-index:50}.visual-select-instruction{position:absolute;top:0;left:0;background:#245f8f;color:white;padding:6px;pointer-events:none;font:12px system-ui}body{height:100vh;display:flex;flex-direction:column;overflow:hidden}#tools{height:auto;min-height:48px;flex:none}#viewerContainer{position:absolute;inset:var(--reader-toolbar-height,104px) 0 0;min-height:0;width:100%}</style></head><body><div id="tools"><button id="prev" aria-label="上一页">↑</button><label>页<input id="page" type="number" min="1" value="1" aria-label="页码"></label><span id="count">/ —</span><button id="next" aria-label="下一页">↓</button><select id="scale" aria-label="缩放"><option value="page-width">适合宽度</option><option value="page-fit">整页</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><a id="download" download="original.pdf">下载原文</a><button id="addAnnotation" disabled>添加批注</button><button id="selectVisual" hidden>框选图表</button><button id="reviewVisualPage" hidden>审核整页</button><span id="readerState" role="status">加载中…</span></div><div id="viewerContainer" tabindex="0"><div id="viewer" class="pdfViewer"></div><p id="error" hidden></p></div><script type="module" src="/original-reader.mjs?v=visual-discovery-1"></script></body></html>
